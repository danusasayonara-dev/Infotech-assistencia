<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071426">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Infotech">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Infotech Assistência</title>
<style>
:root{--bg:#071426;--panel:#10243d;--panel2:#142d4b;--line:#244260;--text:#f4f8ff;--muted:#a9bad0;--blue:#27a5ff;--cyan:#45d4e8;--green:#35c98b;--red:#ff6b78;--gold:#ffc857}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#071426,#0b1b30 45%,#071426);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:84px}
header{padding:22px 18px 16px;background:#08182b;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--blue),#1556a0);display:grid;place-items:center;font-weight:900;font-size:20px}
h1{font-size:18px;margin:0}header small{color:var(--muted)}main{max-width:850px;margin:auto;padding:16px}
nav{position:fixed;bottom:0;left:0;right:0;background:#08182bf2;border-top:1px solid var(--line);display:flex;overflow:auto;z-index:10;padding:7px 4px calc(7px + env(safe-area-inset-bottom))}
nav button{background:none;border:0;color:var(--muted);min-width:75px;font-size:11px;padding:6px 4px}nav button span{display:block;font-size:20px;margin-bottom:3px}nav button.active{color:var(--cyan)}
h2{font-size:21px;margin:8px 0 14px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:linear-gradient(145deg,var(--panel),#0d2037);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}.stat{font-size:24px;font-weight:800;margin-top:5px}.label{color:var(--muted);font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
button,.btn{border:0;border-radius:11px;background:var(--blue);color:#041321;font-weight:750;padding:11px 14px;font-size:14px;cursor:pointer}.secondary{background:#203b5b;color:var(--text);border:1px solid #345777}.danger{background:#5a2634;color:#ffe9ed}.success{background:#174c42;color:#d8fff2}
input,select,textarea{width:100%;background:#08182b;border:1px solid #315171;border-radius:10px;padding:12px;color:var(--text);font:inherit;margin:5px 0 12px}textarea{min-height:75px;resize:vertical}label{display:block;font-size:13px;color:var(--muted)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.item{padding:12px 0;border-top:1px solid var(--line)}.item:first-child{border-top:0}.item strong{display:block}.item small{color:var(--muted)}.pill{display:inline-block;padding:3px 8px;border-radius:20px;background:#1a3b5b;color:#bdeaff;font-size:11px;margin-top:5px}.empty{color:var(--muted);padding:20px;text-align:center}.hidden{display:none!important}.notice{font-size:12px;color:var(--muted);line-height:1.5}.money{color:var(--green)}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.row button{padding:7px 10px;font-size:12px}
@media(max-width:420px){.formgrid{grid-template-columns:1fr}.grid{gap:8px}.stat{font-size:21px}}
</style>
</head>
<body>
<header><div class="brand"><div class="logo">I</div><div><h1>INFOTECH ASSISTÊNCIA</h1><small>Gestão da sua loja</small></div></div></header>
<main id="app"></main>
<nav id="nav">
<button data-page="home" class="active"><span>⌂</span>Início</button>
<button data-page="os"><span>🔧</span>Serviços</button>
<button data-page="sales"><span>📱</span>Vendas</button>
<button data-page="stock"><span>📦</span>Estoque</button>
<button data-page="clients"><span>👥</span>Clientes</button>
<button data-page="finance"><span>💰</span>Caixa</button>
<button data-page="goals"><span>🐷</span>Cofrinhos</button>
</nav>
<script>
const KEY='infotech_assistencia_v1';
const empty={clients:[],orders:[],sales:[],stock:[],expenses:[],goals:[]};
let db=load(),page='home';
function load(){try{return {...empty,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return structuredClone(empty)}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
const brl=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function setPage(p){page=p;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>setPage(b.dataset.page));
function shell(title,body){return `<h2>${title}</h2>${body}`}
function field(label,name,type='text',extra=''){return `<label>${label}<input name="${name}" type="${type}" ${extra}></label>`}
function selectField(label,name,opts){return `<label>${label}<select name="${name}">${opts.map(x=>`<option>${x}</option>`).join('')}</select></label>`}
function formBox(title,fields,submit){return `<section class="card"><strong>${title}</strong><form onsubmit="${submit}(event)">${fields}<button type="submit">Salvar</button></form></section>`}
function list(items,renderItem){return items.length?items.slice().reverse().map(renderItem).join(''):`<div class="empty">Nenhum registro cadastrado ainda.</div>`}
function render(){
 const a=document.getElementById('app');
 if(page==='home'){
  const revenue=db.sales.reduce((s,x)=>s+ +x.price,0),cost=db.sales.reduce((s,x)=>s+(+x.buy||0)+(+x.parts||0)+(+x.unlock||0)+(+x.other||0),0);
  const profit=revenue-cost,open=db.orders.filter(x=>x.status!=='Entregue').length;
  a.innerHTML=shell('Painel principal',`<div class="grid">
  <div class="card"><div class="label">Vendas registradas</div><div class="stat">${db.sales.length}</div></div>
  <div class="card"><div class="label">Lucro das vendas</div><div class="stat money">${brl(profit)}</div></div>
  <div class="card"><div class="label">Serviços em andamento</div><div class="stat">${open}</div></div>
  <div class="card"><div class="label">Clientes cadastrados</div><div class="stat">${db.clients.length}</div></div></div>
  <div class="card"><strong>Bem-vinda à Infotech!</strong><p class="notice">Use o menu inferior para registrar serviços, vendas, estoque, clientes, despesas e metas de economia.</p><div class="actions"><button onclick="setPage('os')">Nova ordem de serviço</button><button class="secondary" onclick="setPage('sales')">Registrar venda</button></div></div>
  <div class="card"><strong>Seus dados</strong><p class="notice">Os registros ficam salvos neste iPhone/navegador. Faça backups frequentes em “Caixa”. A sincronização automática na nuvem ainda precisa ser configurada.</p></div>`);
 }
 if(page==='clients') a.innerHTML=shell('Clientes',formBox('Novo cliente',field('Nome','name')+field('Telefone / WhatsApp','phone')+field('Observações','notes'), 'addClient')+`<section class="card"><strong>Clientes cadastrados</strong>${list(db.clients,x=>`<div class="item"><strong>${esc(x.name)}</strong><small>${esc(x.phone)} ${x.notes?'• '+esc(x.notes):''}</small></div>`)}</section>`);
 if(page==='os') a.innerHTML=shell('Ordens de serviço',formBox('Nova ordem',field('Cliente','client')+field('Aparelho','device')+field('Defeito relatado','issue')+field('Valor do serviço (R$)','price','number','step="0.01" min="0"')+selectField('Status','status',['Recebido','Em análise','Aguardando peça','Em conserto','Pronto','Entregue']), 'addOrder')+`<section class="card"><strong>Ordens cadastradas</strong>${list(db.orders,x=>`<div class="item"><div class="row"><strong>${esc(x.device)} — ${esc(x.client)}</strong><select style="width:auto;margin:0" onchange="changeStatus('${x.id}',this.value)">${['Recebido','Em análise','Aguardando peça','Em conserto','Pronto','Entregue'].map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select></div><small>${esc(x.issue)} • ${brl(x.price)}</small><br><span class="pill">${esc(x.status)}</span></div>`)}</section>`);
 if(page==='sales') a.innerHTML=shell('Vendas de celulares',formBox('Registrar venda',field('Aparelho / modelo','device')+`<div class="formgrid">${field('Custo de compra (R$)','buy','number','step="0.01" min="0"')}${field('Peças (R$)','parts','number','step="0.01" min="0"')}${field('Desbloqueio (R$)','unlock','number','step="0.01" min="0"')}${field('Outros custos (R$)','other','number','step="0.01" min="0"')}</div>`+field('Preço de venda (R$)','price','number','step="0.01" min="0"')+field('Data','date','date'), 'addSale')+`<section class="card"><strong>Histórico de vendas</strong>${list(db.sales,x=>`<div class="item"><strong>${esc(x.device)}</strong><small>Venda: ${brl(x.price)} • Custo: ${brl((+x.buy||0)+(+x.parts||0)+(+x.unlock||0)+(+x.other||0))}</small><div class="money"><b>Lucro: ${brl(x.profit)}</b></div></div>`)}</section>`);
 if(page==='stock') a.innerHTML=shell('Estoque',formBox('Adicionar item',field('Peça / acessório','name')+`<div class="formgrid">${field('Quantidade','qty','number','min="0"')}${field('Custo unitário (R$)','cost','number','step="0.01" min="0"')}</div>`, 'addStock')+`<section class="card"><strong>Itens em estoque</strong>${list(db.stock,x=>`<div class="item row"><div><strong>${esc(x.name)}</strong><small>${x.qty} unidade(s) • ${brl(x.cost)} cada</small></div><button class="secondary" onclick="stockOut('${x.id}')">Baixar 1</button></div>`)}</section>`);
 if(page==='finance') {const total=db.sales.reduce((s,x)=>s+ +x.price,0),expenses=db.expenses.reduce((s,x)=>s+ +x.value,0);a.innerHTML=shell('Caixa e despesas',`<div class="grid"><div class="card"><div class="label">Total vendido</div><div class="stat">${brl(total)}</div></div><div class="card"><div class="label">Despesas lançadas</div><div class="stat">${brl(expenses)}</div></div><div class="card"><div class="label">Saldo simples</div><div class="stat money">${brl(total-expenses)}</div></div></div>`+formBox('Nova despesa',field('Descrição','description')+field('Valor (R$)','value','number','step="0.01" min="0"')+field('Data','date','date'),'addExpense')+`<section class="card"><strong>Despesas</strong>${list(db.expenses,x=>`<div class="item"><strong>${esc(x.description)}</strong><small>${esc(x.date||'')} • ${brl(x.value)}</small></div>`)}</section><section class="card"><strong>Backup dos dados</strong><p class="notice">Exporte uma cópia para guardar com segurança. Para restaurar, selecione um arquivo de backup JSON.</p><div class="actions"><button onclick="backup()">Exportar backup</button><label class="btn secondary">Restaurar backup<input type="file" accept="application/json" onchange="restore(event)" style="display:none"></label></div></section>`)}
 if(page==='goals') a.innerHTML=shell('Cofrinhos e metas',formBox('Criar meta',field('Nome da meta','name')+field('Valor desejado (R$)','target','number','step="0.01" min="1"')+field('Quantidade de quadradinhos','count','number','min="1" max="500" value="20"'), 'addGoal')+`<section class="card"><strong>Metas criadas</strong>${list(db.goals,g=>{let done=g.boxes.filter(b=>b.done).reduce((s,b)=>s+b.value,0);return `<div class="item"><strong>${esc(g.name)} — ${brl(g.target)}</strong><small>Guardado: ${brl(done)} • ${g.boxes.filter(b=>b.done).length}/${g.boxes.length} depósitos</small><div class="grid" style="margin-top:10px">${g.boxes.map((b,i)=>`<button class="${b.done?'success':'secondary'}" onclick="toggleBox('${g.id}',${i})" style="padding:8px 3px">${brl(b.value)}${b.done?' ✓':''}</button>`).join('')}</div></div>`})}</section>`);
}
function values(e){return Object.fromEntries(new FormData(e.target).entries())}
function addClient(e){e.preventDefault();db.clients.push({...values(e),id:id()});save();render()}
function addOrder(e){e.preventDefault();db.orders.push({...values(e),id:id(),date:new Date().toISOString()});save();render()}
function changeStatus(i,s){let x=db.orders.find(x=>x.id===i);if(x){x.status=s;save()}}
function addSale(e){e.preventDefault();let x=values(e);x.id=id();x.profit=(+x.price||0)-((+x.buy||0)+(+x.parts||0)+(+x.unlock||0)+(+x.other||0));db.sales.push(x);save();render()}
function addStock(e){e.preventDefault();db.stock.push({...values(e),id:id()});save();render()}
function stockOut(i){let x=db.stock.find(x=>x.id===i);if(x&&+x.qty>0){x.qty=+x.qty-1;save();render()}}
function addExpense(e){e.preventDefault();db.expenses.push({...values(e),id:id()});save();render()}
function addGoal(e){e.preventDefault();let x=values(e),target=Math.round((+x.target)*100),count=Math.max(1,Math.min(500,+x.count||20));let vals=Array.from({length:count},(_,i)=>i+1);let sum=vals.reduce((a,b)=>a+b,0);let boxes;if(sum<=target){let scale=target/sum;boxes=vals.map(v=>Math.floor(v*scale));let diff=target-boxes.reduce((a,b)=>a+b,0);for(let i=boxes.length-1;i>=0&&diff>0;i--){boxes[i]++;diff--}}else{boxes=vals.map((v,i)=>i===count-1?target-vals.slice(0,-1).reduce((a,b)=>a+b,0):v);if(boxes.some(v=>v<=0)){alert('Aumente o valor da meta ou reduza a quantidade de quadradinhos.');return}}
 db.goals.push({id:id(),name:x.name,target:target/100,boxes:boxes.map(v=>({value:v/100,done:false}))});save();render()}
function toggleBox(g,i){let x=db.goals.find(x=>x.id===g);if(x){x.boxes[i].done=!x.boxes[i].done;save();render()}}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup-infotech-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.clients||!d.sales)throw 0;if(confirm('Isso substituirá os dados atuais. Deseja continuar?')){db={...empty,...d};save();render();alert('Backup restaurado!')}}catch(err){alert('Arquivo de backup inválido.')}};r.readAsText(f)}
render();
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body></html>
