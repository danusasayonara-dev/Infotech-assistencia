<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071426">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Infotech">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Infotech Assistência</title>
<style>
:root{--bg:#071426;--panel:#10243d;--panel2:#142d4b;--line:#244260;--text:#f4f8ff;--muted:#a9bad0;--blue:#27a5ff;--cyan:#45d4e8;--green:#35c98b;--red:#ff6b78;--gold:#ffc857}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#071426,#0b1b30 45%,#071426);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:84px}
header{padding:22px 18px 16px;background:#08182b;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--blue),#1556a0);display:grid;place-items:center;font-weight:900;font-size:20px}
h1{font-size:18px;margin:0}header small{color:var(--muted)}main{max-width:850px;margin:auto;padding:16px}
nav{position:fixed;bottom:0;left:0;right:0;background:#08182bf2;border-top:1px solid var(--line);display:flex;overflow:auto;z-index:10;padding:7px 4px calc(7px + env(safe-area-inset-bottom))}
nav button{background:none;border:0;color:var(--muted);min-width:75px;font-size:11px;padding:6px 4px}nav button span{display:block;font-size:20px;margin-bottom:3px}nav button.active{color:var(--cyan)}
h2{font-size:21px;margin:8px 0 14px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:linear-gradient(145deg,var(--panel),#0d2037);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}.stat{font-size:24px;font-weight:800;margin-top:5px}.label{color:var(--muted);font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
button,.btn{border:0;border-radius:11px;background:var(--blue);color:#041321;font-weight:750;padding:11px 14px;font-size:14px;cursor:pointer}.secondary{background:#203b5b;color:var(--text);border:1px solid #345777}.danger{background:#5a2634;color:#ffe9ed}.success{background:#174c42;color:#d8fff2}
input,select,textarea{width:100%;background:#08182b;border:1px solid #315171;border-radius:10px;padding:12px;color:var(--text);font:inherit;margin:5px 0 12px}textarea{min-height:75px;resize:vertical}label{display:block;font-size:13px;color:var(--muted)}.formgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}input,select,textarea{min-width:0;max-width:100%}input[type=date]{width:100%;min-width:0;max-width:100%;display:block;appearance:none;-webkit-appearance:none}.item{padding:12px 0;border-top:1px solid var(--line)}.item:first-child{border-top:0}.item strong{display:block}.item small{color:var(--muted)}.pill{display:inline-block;padding:3px 8px;border-radius:20px;background:#1a3b5b;color:#bdeaff;font-size:11px;margin-top:5px}.empty{color:var(--muted);padding:20px;text-align:center}.hidden{display:none!important}.notice{font-size:12px;color:var(--muted);line-height:1.5}.money{color:var(--green)}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.row button{padding:7px 10px;font-size:12px}
@media(max-width:420px){.formgrid{grid-template-columns:1fr}.grid{gap:8px}.stat{font-size:21px}}
</style>
</head>
<body>
<header><div class="brand"><div class="logo">✦</div><div><h1>INFOTECH ASSISTÊNCIA</h1><small>Gestão da sua loja</small></div></div></header>
<main id="app"></main>
<nav id="nav">
<button data-page="home" class="active"><span>⌂</span>Início</button>
<button data-page="os"><span>🔧</span>Serviços</button>\n<button data-page="quotes"><span>🧾</span>Orçamentos</button>
<button data-page="sales"><span>📱</span>Vendas</button>
<button data-page="stock"><span>📦</span>Estoque</button>
<button data-page="clients"><span>👥</span>Clientes</button>
<button data-page="finance"><span>💰</span>Caixa</button>
<button data-page="goals"><span>🐷</span>Cofrinhos</button>
<button data-page="retail"><span>🛠️</span>Lojistas</button>
<button data-page="reports"><span>📊</span>Relatórios</button>
</nav>
<script>
const KEY='infotech_assistencia_v1';
const empty={clients:[],orders:[],quotes:[],sales:[],stock:[],expenses:[],goals:[],retailServices:[],ledger:[]};
let db=load(),page='home'; db.quotes=db.quotes||[];
function load(){try{let d={...empty,...JSON.parse(localStorage.getItem(KEY)||'{}')};d.ledger=d.ledger||[];d.retailServices=d.retailServices||[];if(!d.migratedLedger){(d.sales||[]).forEach(x=>{d.ledger.push({id:id(),ref:x.id,type:'in',category:'Vendas de aparelhos',description:(x.kind||'')+' - '+(x.device||'Aparelho'),value:+x.price||0,date:x.date||''});d.ledger.push({id:id(),ref:x.id+'-cost',type:'out',category:'Custo de aparelhos',description:'Custo '+(x.device||'Aparelho'),value:(+x.buy||0)+(+x.parts||0)+(+x.unlock||0)+(+x.other||0),date:x.date||''})});(d.expenses||[]).forEach(x=>d.ledger.push({id:id(),type:'out',category:'Despesas',description:x.description,value:+x.value||0,date:x.date||''}));d.migratedLedger=true;localStorage.setItem(KEY,JSON.stringify(d))}return d}catch(e){return structuredClone(empty)}}
function save(){const snapshot=JSON.stringify(db);try{localStorage.setItem(KEY+'_auto_backup',snapshot);localStorage.setItem(KEY,snapshot);localStorage.setItem(KEY+'_backup_date',new Date().toISOString())}catch(e){alert('Não foi possível salvar. O armazenamento do navegador pode estar cheio. Faça um backup manual.')}}
const brl=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function setPage(p){page=p;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>setPage(b.dataset.page));
function shell(title,body){return `<h2>${title}</h2>${body}`}
function field(label,name,type='text',extra=''){return `<label>${label}<input name="${name}" type="${type}" ${extra}></label>`}
function selectField(label,name,opts){return `<label>${label}<select name="${name}">${opts.map(x=>`<option>${x}</option>`).join('')}</select></label>`}
function formBox(title,fields,submit){return `<section class="card"><strong>${title}</strong><form onsubmit="${submit}(event)">${fields}<button type="submit">Salvar</button></form></section>`}
function list(items,renderItem){return items.length?items.slice().reverse().map(renderItem).join(''):`<div class="empty">Nenhum registro cadastrado ainda.</div>`}
function render(){
 const a=document.getElementById('app');
 if(page==='home'){
  const month=new Date().toISOString().slice(0,7),ins=(db.ledger||[]).filter(x=>x.type==='in'&&(x.date||'').startsWith(month)).reduce((s,x)=>s+(+x.value||0),0),outs=(db.ledger||[]).filter(x=>x.type==='out'&&(x.date||'').startsWith(month)).reduce((s,x)=>s+(+x.value||0),0);
  const profit=ins-outs,open=db.orders.filter(x=>x.status!=='Entregue').length,ready=db.orders.filter(x=>x.status==='Pronto').length,low=db.stock.filter(x=>(+x.qty||0)<=(+x.minQty||0)).length;
  a.innerHTML=shell('Painel principal',`<div class="grid">
  <div class="card"><div class="label">Entradas no mês</div><div class="stat">${brl(ins)}</div></div>
  <div class="card"><div class="label">Saídas no mês</div><div class="stat">${brl(outs)}</div></div>
  <div class="card"><div class="label">Resultado estimado do mês</div><div class="stat money">${brl(profit)}</div></div>
  <div class="card"><div class="label">OS abertas / prontas</div><div class="stat">${open} / ${ready}</div></div>
  <div class="card"><div class="label">Clientes cadastrados</div><div class="stat">${db.clients.length}</div></div>
  <div class="card"><div class="label">Alertas de estoque baixo</div><div class="stat">${low}</div></div></div>
  <div class="card"><strong>Bem-vinda à Infotech!</strong><p class="notice">Use o menu inferior para registrar serviços, vendas, estoque, clientes, despesas e metas de economia.</p><div class="actions"><button onclick="setPage('os')">Nova ordem de serviço</button><button class="secondary" onclick="setPage('sales')">Registrar venda</button></div></div>
  <div class="card"><strong>Busca rápida</strong><input id="globalSearch" placeholder="Buscar cliente, aparelho, OS, venda ou produto" oninput="globalFind(this.value)"><div id="globalResults" class="notice"></div></div><div class="card"><strong>Seus dados</strong><p class="notice">Salvamento local automático a cada alteração e cópia de segurança local no navegador. Faça também backup JSON manual em Caixa. Sincronização em nuvem/login exige configurar um serviço de banco de dados e credenciais privadas.</p><small class="muted">Último salvamento local: ${esc(localStorage.getItem(KEY+'_backup_date')||'ainda não registrado')}</small></div>`);
 }
 if(page==='clients') a.innerHTML=shell('Clientes',formBox('Novo cliente',field('Nome','name')+field('Telefone / WhatsApp','phone','tel','placeholder="(62) 99999-9999" maxlength="15" oninput="maskPhone(this)"')+field('Observações','notes'), 'addClient')+`<section class="card"><strong>Clientes cadastrados</strong>${list(db.clients,x=>`<div class="item"><strong>${esc(x.name)}</strong><small>${esc(x.phone)} ${x.notes?'• '+esc(x.notes):''}</small><div class="actions"><button class="secondary" onclick="editRecord('clients','${x.id}')">Editar</button><button class="danger" onclick="deleteRecord('clients','${x.id}')">Excluir</button></div></div>`)}</section>`);
 if(page==='os') a.innerHTML=shell('Ordens de serviço',formBox('Nova ordem',selectField('Cliente cadastrado','client',db.clients.map(c=>c.name+' — '+c.phone))+field('Aparelho / modelo','device')+field('Defeito relatado / serviço realizado','issue')+`<div class="formgrid">${field('Valor cobrado (R$)','price','number','step="0.01" min="0"')}${field('Custo das peças (R$)','partsCost','number','step="0.01" min="0"')}</div>`+field('Fornecedor das peças','supplier')+`<div class="formgrid">${field('Entrega / Uber (R$)','deliveryValue','number','step="0.01" min="0"')}${selectField('Quem pagou?','deliveryPayer',['Loja','Cliente'])}</div>`+field('Descrição da entrega','deliveryDescription')+selectField('Garantia','warranty',['1 mês','3 meses','6 meses','12 meses']), 'addOrder')+`<section class="card"><strong>Ordens cadastradas</strong>${list(db.orders,x=>`<div class="item"><div class="row"><strong>${esc(x.device)} — ${esc(x.client)}</strong><select style="width:auto;margin:0" onchange="changeStatus('${x.id}',this.value)">${(x.status==='Entregue'?['Entregue','Garantia']:x.status==='Garantia'?['Garantia','Entregue']:['Recebido','Em análise','Aguardando peça','Em conserto','Pronto','Entregue']).map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select></div><small>${esc(x.issue)} • Cobrado: ${brl(x.price)} • Peças: ${brl(x.partsCost||0)} • ${esc(x.warranty||'')}</small><br><span class="pill">${esc(x.status)}</span><div class="actions"><button class="secondary" onclick="editRecord('orders','${x.id}')">Editar</button><button class="danger" onclick="deleteRecord('orders','${x.id}')">Excluir</button><button class="secondary" onclick="printService('${x.id}')">Imprimir comprovante</button>${x.status==='Pronto'?`<button class="secondary" onclick="printAbandon('${x.id}')">Termo 30 dias (2 vias)</button>`:''}</div></div>`)}</section>`);
 if(page==='quotes') a.innerHTML=shell('Orçamentos',formBox('Novo orçamento',selectField('Cliente cadastrado','client',db.clients.map(c=>c.name+' — '+c.phone))+field('Aparelho / modelo','device')+field('Serviço / peças previstos','description')+`<div class="formgrid">${field('Valor estimado (R$)','value','number','step="0.01" min="0"')}${field('Validade até','validUntil','date')}</div>`+selectField('Situação','status',['Pendente','Aprovado','Recusado','Convertido em OS']), 'addQuote')+`<section class="card"><strong>Orçamentos cadastrados</strong>${list(db.quotes,x=>`<div class="item"><strong>${esc(x.client)} — ${esc(x.device)}</strong><small>${esc(x.description)} • ${brl(x.value)} • Validade: ${esc(x.validUntil||'—')}</small><br><span class="pill">${esc(x.status)}</span><div class="actions"><button class="secondary" onclick="editRecord('quotes','${x.id}')">Editar</button><button class="danger" onclick="deleteRecord('quotes','${x.id}')">Excluir</button></div></div>`)}</section>`);
 if(page==='sales') a.innerHTML=shell('Vendas de celulares',formBox('Registrar venda',field('Aparelho / modelo','device')+selectField('Tipo de aparelho','kind',['Novo','Seminovo'])+`<div class="formgrid">${field('Custo de compra (R$)','buy','number','step="0.01" min="0"')}${field('Peças (R$)','parts','number','step="0.01" min="0"')}${field('Desbloqueio (R$)','unlock','number','step="0.01" min="0"')}${field('Outros custos (R$)','other','number','step="0.01" min="0"')}</div>`+field('Preço de venda (R$)','price','number','step="0.01" min="0"')+field('Data','date','date'), 'addSale')+`<section class="card"><strong>Histórico de vendas</strong>${list(db.sales,x=>`<div class="item"><strong>${esc(x.device)} — ${esc(x.kind||'')}</strong><small>Venda: ${brl(x.price)} • Custo: ${brl((+x.buy||0)+(+x.parts||0)+(+x.unlock||0)+(+x.other||0))}</small><div class="money"><b>Lucro: ${brl(x.profit)}</b></div><div class="actions"><button class="secondary" onclick="editRecord('sales','${x.id}')">Editar</button><button class="danger" onclick="deleteRecord('sales','${x.id}')">Excluir</button></div></div>`)}</section>`);
 if(page==='stock') a.innerHTML=shell('Estoque',formBox('Adicionar item',field('Peça / acessório','name')+`<div class="formgrid">${field('Quantidade','qty','number','min="0"')}${field('Custo unitário (R$)','cost','number','step="0.01" min="0"')}${field('Preço de venda unitário (R$)','sellPrice','number','step="0.01" min="0"')}${field('Estoque mínimo','minQty','number','min="0"')}}</div>`, 'addStock')+`<section class="card"><strong>Itens em estoque</strong>${list(db.stock,x=>`<div class="item row"><div><strong>${esc(x.name)}</strong><small>${x.qty} unidade(s) • ${brl(x.cost)} cada</small></div><div class="actions"><button class="secondary" onclick="editRecord('stock','${x.id}')">Editar</button><button class="danger" onclick="deleteRecord('stock','${x.id}')">Excluir</button><button class="secondary" onclick="stockOut('${x.id}')">Vender / baixar</button></div></div>`)}</section>`);
 if(page==='finance') {const total=(db.ledger||[]).filter(x=>x.type==='in').reduce((s,x)=>s+(+x.value||0),0),expenses=(db.ledger||[]).filter(x=>x.type==='out').reduce((s,x)=>s+(+x.value||0),0);a.innerHTML=shell('Caixa e despesas',`<div class="grid"><div class="card"><div class="label">Total vendido</div><div class="stat">${brl(total)}</div></div><div class="card"><div class="label">Despesas lançadas</div><div class="stat">${brl(expenses)}</div></div><div class="card"><div class="label">Saldo simples</div><div class="stat money">${brl(total-expenses)}</div></div></div>`+formBox('Nova despesa',field('Descrição','description')+field('Valor (R$)','value','number','step="0.01" min="0"')+field('Data','date','date'),'addExpense')+`<section class="card"><strong>Movimentações do caixa</strong>${list(db.ledger||[],x=>`<div class="item"><strong>${esc(x.description)}</strong><small>${esc(x.date||'')} • ${esc(x.category||'')} • ${x.type==='in'?'Entrada':'Saída'}: ${brl(x.value)}</small></div>`)}</section><section class="card"><strong>Despesas</strong>${list(db.expenses,x=>`<div class="item"><strong>${esc(x.description)}</strong><small>${esc(x.date||'')} • ${brl(x.value)}</small><div class="actions"><button class="secondary" onclick="editRecord('expenses','${x.id}')">Editar</button><button class="danger" onclick="deleteRecord('expenses','${x.id}')">Excluir</button></div></div>`)}</section><section class="card"><strong>Backup dos dados</strong><p class="notice">Exporte uma cópia para guardar com segurança. Para restaurar, selecione um arquivo de backup JSON.</p><div class="actions"><button onclick="backup()">Exportar backup</button><label class="btn secondary">Restaurar backup<input type="file" accept="application/json" onchange="restore(event)" style="display:none"></label></div></section>`)}
 if(page==='goals') a.innerHTML=shell('Cofrinhos e metas',formBox('Criar meta',field('Nome da meta','name')+field('Valor desejado (R$)','target','number','step="0.01" min="1"'), 'addGoal')+`<section class="card"><strong>Metas criadas</strong>${list(db.goals,g=>{let done=g.boxes.filter(b=>b.done).reduce((s,b)=>s+b.value,0);let pct=Math.min(100,g.target?done/g.target*100:0);return `<div class="item"><div class="row"><strong>${esc(g.name)} — ${brl(g.target)}</strong><button class="secondary" onclick="toggleGoal('${g.id}')">${g.expanded===false?'Expandir':'Minimizar'}</button></div><small>Guardado: ${brl(done)} • ${pct.toFixed(1).replace('.',',')}% concluído • ${g.boxes.length} quadradinhos</small><div style="height:7px;background:#203b5b;border-radius:8px;margin:8px 0"><div style="height:7px;width:${pct}%;background:var(--green);border-radius:8px"></div></div>${g.expanded===false?'':`<div class="grid" style="margin-top:10px">${g.boxes.map((b,i)=>`<button class="${b.done?'success':'secondary'}" onclick="toggleBox('${g.id}',${i})" style="padding:8px 3px">${brl(b.value)}${b.done?' ✓':''}</button>`).join('')}</div>`}<div class="actions"><button class="secondary" onclick="editRecord('goals','${g.id}')">Editar nome/meta</button><button class="danger" onclick="deleteGoal('${g.id}')">Excluir cofrinho</button></div></div>`})}</section>`);

 if(page==='retail') a.innerHTML=shell('Serviços para lojistas',formBox('Registrar serviço para lojista',field('Nome da loja','store')+field('Tipo de serviço','service')+field('Valor da mão de obra (R$)','labor','number','step="0.01" min="0"')+field('Data','date','date')+field('Observações','notes'),'addRetail')+`<section class="card"><strong>Histórico por loja</strong>${list(db.retailServices||[],x=>`<div class="item"><strong>${esc(x.store)} — ${esc(x.service)}</strong><small>${esc(x.date)} • Mão de obra: ${brl(x.labor)}</small><div class="actions"><button class="secondary" onclick="editRecord('retailServices','${x.id}')">Editar</button><button class="danger" onclick="deleteRecord('retailServices','${x.id}')">Excluir</button></div></div>`)}</section>`);
 if(page==='reports') {const cats=['Serviços','Vendas de aparelhos','Produtos do estoque','Serviços para lojistas'];let rows=(db.ledger||[]).filter(x=>x.type==='in');a.innerHTML=shell('Relatórios',`<section class="card"><strong>Relatório detalhado do caixa</strong><p class="notice">Entradas registradas por operação e categoria.</p>${cats.map(c=>`<div class="item"><strong>${c}</strong><small>${brl(rows.filter(x=>x.category===c).reduce((s,x)=>s+(+x.value||0),0))}</small></div>`).join('')}<div class="item"><strong>TOTAL DE ENTRADAS: ${brl(rows.reduce((s,x)=>s+(+x.value||0),0))}</strong></div><button onclick="printCashReport()">Imprimir relatório do caixa</button></section>`)}
}
function globalFind(q){let el=document.getElementById('globalResults');if(!el)return;let s=String(q||'').toLowerCase().trim();if(!s){el.innerHTML='';return}let found=[];for(let [k,arr] of Object.entries({Clientes:db.clients,OS:db.orders,Orçamentos:db.quotes,Vendas:db.sales,Estoque:db.stock})){for(let x of arr||[]){let t=JSON.stringify(x).toLowerCase();if(t.includes(s))found.push(k+': '+(x.name||x.client||x.device||x.id))}}el.innerHTML=found.length?found.slice(0,20).map(esc).join('<br>'):'Nenhum resultado.'}
function values(e){return Object.fromEntries(new FormData(e.target).entries())}

const editableFields={
 clients:[['Nome','name'],['Telefone','phone'],['Observações','notes']],
 quotes:[['Cliente','client'],['Aparelho','device'],['Serviço / peças','description'],['Valor estimado','value'],['Validade até','validUntil'],['Situação','status']],
 orders:[['Cliente','client'],['Aparelho','device'],['Defeito / serviço','issue'],['Valor cobrado','price'],['Custo das peças','partsCost'],['Fornecedor','supplier'],['Garantia','warranty'],['Valor entrega/Uber','deliveryValue'],['Quem pagou entrega (Loja/Cliente)','deliveryPayer'],['Descrição da entrega','deliveryDescription']],
 sales:[['Tipo (Novo/Seminovo)','kind'],['Aparelho','device'],['IMEI','imei'],['Data','date'],['Custo compra','buy'],['Custo peças','parts'],['Desbloqueio','unlock'],['Outros custos','other'],['Preço venda','price']],
 stock:[['Produto','name'],['Quantidade','qty'],['Custo unitário','cost'],['Preço venda','sellPrice'],['Estoque mínimo','minQty'],['Fornecedor','supplier']],
 expenses:[['Descrição','description'],['Valor','value'],['Data','date'],['Tipo (Fixa/Variável)','kind']],
 goals:[['Nome do cofrinho','name'],['Meta em reais','target']],
 retailServices:[['Loja','store'],['Serviço','service'],['Mão de obra','labor'],['Data','date'],['Observações','notes']]
};
function syncFinancial(ref,kind,obj){
 db.ledger=(db.ledger||[]).filter(m=>m.ref!==ref&&m.ref!==ref+'-cost'&&m.ref!==ref+'-delivery');
 const date=obj.date||new Date().toISOString().slice(0,10);
 if(kind==='sales'){db.ledger.push({id:id(),ref,type:'in',category:'Vendas de aparelhos',description:(obj.kind||'')+' - '+(obj.device||''),value:+obj.price||0,date});db.ledger.push({id:id(),ref:ref+'-cost',type:'out',category:'Custo de aparelhos',description:'Custo '+(obj.device||''),value:(+obj.buy||0)+(+obj.parts||0)+(+obj.unlock||0)+(+obj.other||0),date})}
 if(kind==='expenses')db.ledger.push({id:id(),ref,type:'out',category:'Despesas',description:obj.description,value:+obj.value||0,date});
 if(kind==='retailServices')db.ledger.push({id:id(),ref,type:'in',category:'Serviços para lojistas',description:(obj.store||'')+' - '+(obj.service||''),value:+obj.labor||0,date});
 if(kind==='orders'&&obj.status==='Entregue'){db.ledger.push({id:id(),ref,type:'in',category:'Serviços',description:'OS '+obj.client+' - '+obj.device,value:+obj.price||0,date});db.ledger.push({id:id(),ref:ref+'-cost',type:'out',category:'Custo de peças',description:'Peças OS '+obj.device,value:+obj.partsCost||0,date});if(+obj.deliveryValue>0&&obj.deliveryPayer==='Loja')db.ledger.push({id:id(),ref:ref+'-delivery',type:'out',category:'Entrega / Uber',description:obj.deliveryDescription||'Entrega OS '+obj.device,value:+obj.deliveryValue,date})}
}
function editRecord(kind,key){
 let arr=db[kind],x=arr&&arr.find(v=>v.id===key);if(!x)return;
 if(kind==='goals'){let name=prompt('Nome do cofrinho:',x.name);if(name===null)return;let target=prompt('Meta em reais:',x.target);if(target===null)return;let cents=Math.round((Number(String(target).replace(',','.'))||0)*100);if(cents<1){alert('Meta inválida.');return}x.name=name;let boxes=[],sum=0,n=1;while(sum<cents&&n<=1000){boxes.push({value:n,done:false});sum+=n;n++}let oldDone=(x.boxes||[]).filter(b=>b.done).reduce((a,b)=>a+(+b.value||0),0);for(let b of boxes){if(oldDone>=b.value){b.done=true;oldDone-=b.value}}x.target=cents/100;x.boxes=boxes;save();render();return}
 let fields=editableFields[kind];if(!fields)return;
 for(let [label,k] of fields){let val=prompt(label+':',x[k]??'');if(val===null)return;x[k]=val}
 if(['price','partsCost','deliveryValue','value','buy','parts','unlock','other','qty','cost','sellPrice','minQty','labor'].some(k=>fields.some(f=>f[1]===k))){for(let k of ['price','partsCost','deliveryValue','value','buy','parts','unlock','other','qty','cost','sellPrice','minQty','labor','target'])if(x[k]!==undefined)x[k]=Number(String(x[k]).replace(',','.'))||0}
 if(kind==='sales')x.profit=(+x.price||0)-((+x.buy||0)+(+x.parts||0)+(+x.unlock||0)+(+x.other||0));
 if(kind==='orders'&&x.status==='Entregue')x.posted=true;
 syncFinancial(key,kind,x);save();render();
}
function deleteRecord(kind,key){
 let arr=db[kind],x=arr&&arr.find(v=>v.id===key);if(!x)return;
 if(kind==='clients'&&(db.orders.some(o=>o.client===x.name)||db.sales.some(s=>s.client===x.name)||db.quotes.some(q=>q.client===x.name))){alert('Este cliente possui histórico vinculado. Edite o cadastro ou mantenha-o para preservar o histórico.');return}
 if(!confirm('Confirma excluir este registro? Esta ação não poderá ser desfeita.'))return;
 if(kind==='stock'&&x.movements?.length){alert('Produto com movimentações vinculadas: mantenha o cadastro para preservar o histórico.');return}
 db[kind]=arr.filter(v=>v.id!==key);
 if(['sales','expenses','retailServices','orders'].includes(kind))db.ledger=(db.ledger||[]).filter(m=>m.ref!==key&&m.ref!==key+'-cost'&&m.ref!==key+'-delivery');
 if(kind==='quotes')db.quotes=db.quotes.filter(v=>v.id!==key);
 save();render();
}

function addClient(e){e.preventDefault();db.clients.push({...values(e),id:id()});save();render()}
function addOrder(e){e.preventDefault();let x=values(e);x.client=(x.client||'').split(' — ')[0];if(!db.clients.some(c=>c.name===x.client)){alert('Cadastre e selecione um cliente antes de abrir a OS.');return}db.orders.push({...x,id:id(),date:new Date().toISOString().slice(0,10),status:'Recebido',posted:false});save();render()}
function addQuote(e){e.preventDefault();let x=values(e);x.client=(x.client||'').split(' — ')[0];if(!db.clients.some(c=>c.name===x.client)){alert('Cadastre e selecione um cliente antes do orçamento.');return}x.id=id();db.quotes.push(x);save();render()}
function changeStatus(i,s){let x=db.orders.find(x=>x.id===i);if(!x)return;if(x.status==='Entregue'&&s!=='Garantia'&&s!=='Entregue'||x.status==='Garantia'&&s!=='Entregue'&&s!=='Garantia'){alert('Após a entrega, só é permitido alternar entre Entregue e Garantia.');render();return}if(s==='Garantia'){let c=prompt('Confirme/atualize o custo das peças para a garantia (R$):',x.partsCost||'0');if(c===null){render();return}x.partsCost=Number(String(c).replace(',','.'))||0}if(x.status==='Entregue'&&s==='Garantia'){db.ledger=db.ledger.filter(m=>m.ref!==i&&m.ref!==i+'-cost'&&m.ref!==i+'-delivery');x.posted=false}x.status=s;if(s==='Entregue'){syncFinancial(i,'orders',x);x.posted=true}save();render()}
function addSale(e){e.preventDefault();let x=values(e);x.id=id();x.profit=(+x.price||0)-((+x.buy||0)+(+x.parts||0)+(+x.unlock||0)+(+x.other||0));db.sales.push(x);db.ledger.push({id:id(),ref:x.id,type:'in',category:'Vendas de aparelhos',description:(x.kind||'')+' - '+x.device,value:+x.price||0,date:x.date||new Date().toISOString().slice(0,10)});db.ledger.push({id:id(),ref:x.id+'-cost',type:'out',category:'Custo de aparelhos',description:'Custo '+x.device,value:(+x.buy||0)+(+x.parts||0)+(+x.unlock||0)+(+x.other||0),date:x.date||new Date().toISOString().slice(0,10)});save();render()}
function addStock(e){e.preventDefault();db.stock.push({...values(e),id:id()});save();render()}
function stockOut(i){let x=db.stock.find(x=>x.id===i);if(x&&+x.qty>0){let raw=prompt('Informe o valor recebido pela venda (R$):',x.sellPrice||'');if(raw===null)return;let val=Number(raw.replace(',','.'));if(!Number.isFinite(val)||val<0){alert('Valor inválido.');return}x.qty=+x.qty-1;db.ledger.push({id:id(),type:'in',category:'Produtos do estoque',description:'Venda: '+x.name,value:val,date:new Date().toISOString().slice(0,10)});db.ledger.push({id:id(),type:'out',category:'Custo de estoque',description:'Custo: '+x.name,value:+x.cost||0,date:new Date().toISOString().slice(0,10)});save();render()}}
function addExpense(e){e.preventDefault();let x={...values(e),id:id()};db.expenses.push(x);db.ledger.push({id:id(),type:'out',category:'Despesas',description:x.description,value:+x.value||0,date:x.date||new Date().toISOString().slice(0,10)});save();render()}
function addGoal(e){e.preventDefault();let x=values(e),target=Math.round((+x.target)*100);if(target<1){alert('Informe uma meta válida.');return}let boxes=[],sum=0,n=1;while(sum<target&&n<=1000){boxes.push({value:n,done:false});sum+=n;n++}db.goals.push({id:id(),name:x.name,target:target/100,boxes,expanded:true});save();render()}
function toggleBox(g,i){let x=db.goals.find(x=>x.id===g);if(x){x.boxes[i].done=!x.boxes[i].done;save();render()}}
function toggleGoal(g){let x=db.goals.find(x=>x.id===g);if(x){x.expanded=x.expanded===false;save();render()}}
function deleteGoal(g){if(confirm('Deseja realmente excluir este cofrinho e seu histórico de depósitos?')){db.goals=db.goals.filter(x=>x.id!==g);save();render()}}
function maskPhone(el){let n=el.value.replace(/\D/g,'').slice(0,11);if(n.length>2)n='('+n.slice(0,2)+') '+n.slice(2);if(n.replace(/\D/g,'').length>7)n=n.slice(0,-4)+'-'+n.slice(-4);el.value=n}
function addRetail(e){e.preventDefault();let x=values(e);x.id=id();db.retailServices.push(x);db.ledger.push({id:id(),ref:x.id,type:'in',category:'Serviços para lojistas',description:x.store+' - '+x.service,value:+x.labor||0,date:x.date||new Date().toISOString().slice(0,10)});save();render()}
function printDoc(title,body){let w=window.open('','_blank');if(!w){alert('Permita a abertura de janelas para imprimir.');return}w.document.write('<html><head><title>'+title+'</title><style>body{font:14px Arial;padding:28px;color:#111}header{text-align:center;border-bottom:2px solid #1686cf;padding-bottom:12px;margin-bottom:20px}.brand{font-size:23px;font-weight:bold;color:#087bc1}.cnpj{font-size:12px}h2{text-align:center;font-size:18px}p{line-height:1.5}.sign{display:flex;justify-content:space-around;margin-top:65px}.line{border-top:1px solid #111;width:40%;text-align:center;padding-top:7px;font-size:12px}.cut{text-align:center;border-top:1px dashed #555;margin:18px 0;padding-top:6px;font-size:11px}@media print{body{padding:12mm}}</style></head><body>'+body+'<script>window.onload=()=>window.print()<\/script></body></html>');w.document.close()}
function headDoc(){return '<header><div class="brand">INFOTECH ASSISTÊNCIA</div><div class="cnpj">CNPJ: 47.897.628/0001-03</div><div>Rua Tangará, Qd. 38, Lt. 14 — Jardim Cristal — Aparecida de Goiânia/GO</div><div>WhatsApp: (62) 99141-3212</div></header>'}
function warrantyDays(w){let s=String(w||'').toLowerCase();if(s.includes('12')||s.includes('ano'))return 365;if(s.includes('6'))return 180;if(s.includes('3'))return 90;if(s.includes('1'))return 30;return 0}
function addDaysISO(dateStr,days){let d=new Date((dateStr||new Date().toISOString().slice(0,10))+'T12:00:00');d.setDate(d.getDate()+days);return d.toLocaleDateString('pt-BR')}
function printService(i){let x=db.orders.find(x=>x.id===i);if(!x)return;let days=warrantyDays(x.warranty),end=days?addDaysISO(x.date,days):'Sem garantia';printDoc('Comprovante de serviço',headDoc()+'<h2>COMPROVANTE DE SERVIÇO E GARANTIA</h2><p><b>Cliente:</b> '+esc(x.client)+'</p><p><b>Aparelho:</b> '+esc(x.device)+'</p><p><b>Serviço realizado:</b> '+esc(x.issue)+'</p><p><b>Data do serviço:</b> '+esc(x.date)+'</p><p><b>Prazo da garantia:</b> '+esc(x.warranty||'Não informada')+(days?' ('+days+' dias corridos)':'')+'</p><p><b>Data final da garantia:</b> '+end+'</p><p><b>Entrega / Uber:</b> '+brl(x.deliveryValue||0)+' — pago por: '+esc(x.deliveryPayer||'Não informado')+' '+esc(x.deliveryDescription||'')+'</p><p><b>Total pago:</b> '+brl(x.price)+'</p><p>A garantia cobre defeitos relacionados à peça e ao serviço executado. Não cobre danos decorrentes de mau uso, quedas, contato com líquidos ou intervenção de terceiros, respeitados os direitos previstos na legislação aplicável.</p><div class="sign"><div class="line">Assinatura do cliente</div><div class="line">Infotech Assistência</div></div>')}
function printAbandon(i){let x=db.orders.find(x=>x.id===i);if(!x)return;let copy=()=>headDoc()+'<h2>TERMO DE CIÊNCIA — PRAZO PARA RETIRADA DE APARELHO</h2><p>Eu, <b>'+esc(x.client)+'</b>, declaro estar ciente de que o aparelho <b>'+esc(x.device)+'</b>, vinculado à ordem de serviço, deverá ser retirado no prazo de 30 (trinta) dias corridos, contados da comunicação de que está pronto.</p><p>Fui informado(a) de que, caso não realize a retirada, a loja entrará em contato e adotará as medidas legalmente cabíveis para guarda e destinação do bem. Este termo não representa transferência automática da propriedade nem autorização irrestrita para venda do aparelho, devendo qualquer destinação observar a legislação e os direitos do consumidor.</p><p><b>CIÊNCIA DO CLIENTE:</b> ( ) Declaro que li, compreendi e estou ciente das condições acima.</p><p>Cliente: '+esc(x.client)+' • Aparelho: '+esc(x.device)+' • OS: '+esc(x.id)+'</p><p>Data: ____/____/________</p><div class="sign"><div class="line">Assinatura do cliente</div><div class="line">Responsável pela loja</div></div>';printDoc('Termo de ciência - duas vias',copy()+'<div class="cut">✂ ——————————————————— CORTE AQUI ———————————————————</div>'+copy())}
function printCashReport(){let rows=(db.ledger||[]).filter(x=>x.type==='in');let body=headDoc()+'<h2>RELATÓRIO DE ENTRADAS DO CAIXA</h2>'+rows.map(x=>'<p>'+esc(x.date)+' — '+esc(x.category)+' — '+esc(x.description)+' — <b>'+brl(x.value)+'</b></p>').join('')+'<hr><h2>TOTAL DE ENTRADAS: '+brl(rows.reduce((s,x)=>s+(+x.value||0),0))+'</h2>';printDoc('Relatório do caixa',body)}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup-infotech-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.clients||!d.sales)throw 0;if(confirm('Isso substituirá os dados atuais. Deseja continuar?')){db={...empty,...d};save();render();alert('Backup restaurado!')}}catch(err){alert('Arquivo de backup inválido.')}};r.readAsText(f)}
render();
