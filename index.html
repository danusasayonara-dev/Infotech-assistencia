<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071426"><meta name="description" content="Gestão da Infotech Assistência"><link rel="manifest" href="manifest.webmanifest"><title>Infotech Assistência</title>
<style>
:root{--bg:#071426;--panel:#10233c;--panel2:#142c49;--blue:#12a9e8;--cyan:#42d5f5;--txt:#edf6ff;--muted:#9bb0c8;--line:#29435f;--red:#ff6677;--green:#40d49a}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#071426,#0a1b30 55%,#071426);color:var(--txt);font:15px system-ui,-apple-system,Segoe UI,sans-serif}header{padding:18px 16px 14px;background:#08182b;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}header h1{font-size:20px;margin:0;color:white}header small{color:var(--cyan)}main{max-width:900px;margin:auto;padding:14px 12px 90px}.tabs{display:flex;gap:7px;overflow:auto;padding:10px 0;position:sticky;top:67px;background:#09192c;z-index:4}.tabs button{white-space:nowrap}.tab{background:#122944;color:#d8eaff;border:1px solid var(--line);border-radius:12px;padding:10px 13px}.tab.active{background:var(--blue);color:#041321;border-color:var(--blue);font-weight:700}.panel,.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{background:var(--panel2);padding:13px;border-radius:13px}.stat b{display:block;font-size:21px;color:var(--cyan)}label{display:block;color:var(--muted);font-size:13px;margin:10px 0 5px}input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#081a2d;color:var(--txt);font:inherit;min-width:0}textarea{min-height:75px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:10px;padding:11px 14px;background:var(--blue);color:#041321;font-weight:700;margin:8px 5px 0 0}.btn.secondary{background:#29435f;color:white}.btn.danger{background:#632b3a;color:white}.btn.green{background:#167b60;color:white}.item{padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.muted{color:var(--muted)}.pill{font-size:12px;padding:4px 8px;border-radius:20px;background:#244563;color:#c8edff}.hide{display:none!important}.actions{display:flex;flex-wrap:wrap;gap:6px}.empty{color:var(--muted);padding:12px 0}.notice{background:#3b321b;color:#ffe5a3;padding:10px;border-radius:10px;font-size:13px}.good{color:var(--green)}.bad{color:var(--red)}h2{font-size:18px;margin:4px 0 12px}h3{font-size:15px;margin:0 0 5px}@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}main{padding-top:20px}.tabs{top:67px}}
</style></head>
<body><header><h1>INFOTECH <span style="color:#42d5f5">ASSISTÊNCIA</span></h1><small>Gestão da sua assistência técnica</small></header><main>
<nav class="tabs" id="tabs"></nav><section id="app"></section></main>
<script>
const $=s=>document.querySelector(s), money=v=>(Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}), today=()=>new Date().toISOString().slice(0,10);
const blank=()=>({clients:[],orders:[],sales:[],stock:[],expenses:[],cash:[],retail:[],goals:[]});let db;try{db={...blank(),...JSON.parse(localStorage.getItem('infotech_db')||'{}')}}catch{db=blank()}let page='Início';function save(){localStorage.setItem('infotech_db',JSON.stringify(db));render()}function id(){return Date.now()+Math.floor(Math.random()*999)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function field(label,name,type='text',value='',required=false){return `<label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''}>`}function area(label,name,value=''){return `<label>${label}</label><textarea name="${name}">${esc(value)}</textarea>`}function sel(label,name,opts){return `<label>${label}</label><select name="${name}">${opts.map(x=>`<option>${esc(x)}</option>`).join('')}</select>`}function formData(form){return Object.fromEntries(new FormData(form).entries())}function addCash(category,description,amount,type='entrada',ref=null){db.cash.push({id:id(),date:today(),category,description,amount:Number(amount)||0,type,ref})}function section(title,body){return `<div class="panel"><h2>${title}</h2>${body}</div>`}function list(items,fn){return items.length?items.slice().reverse().map(fn).join(''):'<div class="empty">Nenhum registro cadastrado.</div>'}
const pages=['Início','Clientes','Ordens de serviço','Vendas','Estoque','Caixa','Lojistas','Relatórios','Backup'];function nav(){ $('#tabs').innerHTML=pages.map(p=>`<button class="tab ${p===page?'active':''}" onclick="go('${p}')">${p}</button>`).join('') }function go(p){page=p;render()}function render(){nav();let out='';
if(page==='Início'){let month=today().slice(0,7),incomes=db.cash.filter(x=>x.type==='entrada'&&x.date.startsWith(month)).reduce((a,x)=>a+x.amount,0),expenses=db.cash.filter(x=>x.type==='saida'&&x.date.startsWith(month)).reduce((a,x)=>a+x.amount,0);out=`<div class="grid"><div class="stat">Receitas no mês<b>${money(incomes)}</b></div><div class="stat">Despesas no mês<b>${money(expenses)}</b></div><div class="stat">Resultado<b>${money(incomes-expenses)}</b></div><div class="stat">OS em aberto<b>${db.orders.filter(x=>x.status!=='Entregue').length}</b></div></div>${section('Acesso rápido',`<div class="actions"><button class="btn" onclick="go('Clientes')">Cadastrar cliente</button><button class="btn" onclick="go('Ordens de serviço')">Nova ordem de serviço</button><button class="btn" onclick="go('Vendas')">Registrar venda</button></div>`)}${section('Atenção',`<p>Serviços prontos aguardando retirada: <b>${db.orders.filter(x=>x.status==='Pronto').length}</b></p><p>Itens com estoque baixo: <b>${db.stock.filter(x=>Number(x.qty)<=Number(x.min)).length}</b></p><div class="notice">Os dados desta versão ficam salvos neste navegador/dispositivo. Faça backups regularmente. Ainda não há sincronização em nuvem ou login.</div>`)}`}
if(page==='Clientes'){out=section('Cadastrar cliente',`<form id="clientForm">${field('Nome completo','name','text','',true)}${field('Telefone / WhatsApp','phone','tel','',true)}${area('Observações','notes')}<button class="btn">Salvar cliente</button></form>`)+section('Clientes cadastrados',list(db.clients,x=>`<div class="item"><b>${esc(x.name)}</b><div class="muted">${esc(x.phone)} · ${db.orders.filter(o=>o.clientId===x.id).length} OS</div><div>${esc(x.notes)}</div><button class="btn secondary" onclick="clientHistory(${x.id})">Histórico</button><button class="btn danger" onclick="del('clients',${x.id})">Excluir</button></div>`))}
if(page==='Ordens de serviço'){out=section('Nova ordem de serviço',`<form id="orderForm">${sel('Cliente cadastrado','clientId',db.clients.map(c=>c.id+' — '+c.name))}${field('Modelo do aparelho','model','text','',true)}${area('Defeito relatado','defect')}${area('Serviço realizado','work') }<div class="row">${field('Peças / custo (R$)','parts','number','0')}${field('Valor cobrado (R$)','price','number','0')}</div><div class="row">${field('Entrega / Uber (R$)','delivery','number','0')}${sel('Quem pagou a entrega','deliveryPayer',['Loja','Cliente'])}</div>${field('Descrição da entrega','deliveryDesc') }<div class="row">${sel('Garantia','warranty',['Sem garantia comercial','1 mês','3 meses','6 meses','12 meses'])}${sel('Status inicial','status',['Em andamento','Pronto'])}</div><button class="btn">Criar ordem de serviço</button></form>`)+section('Ordens registradas',list(db.orders,o=>{let c=db.clients.find(x=>x.id===o.clientId);return `<div class="item"><b>OS #${o.id} · ${esc(o.model)}</b><div>${esc(c?.name||'Cliente removido')} · ${esc(o.date)} · <span class="pill">${esc(o.status)}</span></div><div class="muted">${esc(o.defect)} · Cobrança ${money(o.price)}</div><div class="actions"><button class="btn secondary" onclick="advance(${o.id})">Avançar status</button><button class="btn secondary" onclick="receipt(${o.id})">Comprovante</button><button class="btn danger" onclick="del('orders',${o.id})">Excluir</button></div></div>`}))}
if(page==='Vendas'){out=section('Registrar venda',`<form id="saleForm">${sel('Tipo','kind',['Celular novo','Celular seminovo','Acessório / produto'])}${field('Produto / modelo','product','text','',true)}<div class="row">${field('Custo (R$)','cost','number','0')}${field('Valor da venda (R$)','price','number','0')}</div>${field('IMEI (se aplicável)','imei')}${sel('Pagamento',['Pagamento'],'') .replace('','') }<button class="btn">Registrar venda</button></form>`)+section('Histórico de vendas',list(db.sales,s=>`<div class="item"><b>${esc(s.product)}</b> <span class="pill">${esc(s.kind)}</span><div>${esc(s.date)} · Venda ${money(s.price)} · Lucro ${money(s.price-s.cost)}</div><button class="btn danger" onclick="del('sales',${s.id})">Excluir</button></div>`))}
if(page==='Estoque'){out=section('Adicionar item ao estoque',`<form id="stockForm">${field('Produto / peça','name','text','',true)}<div class="row">${field('Quantidade','qty','number','0')}${field('Estoque mínimo','min','number','1')}</div><div class="row">${field('Custo unitário (R$)','cost','number','0')}${field('Preço de venda (R$)','price','number','0')}</div>${field('Fornecedor','supplier')}<button class="btn">Salvar item</button></form>`)+section('Estoque atual',list(db.stock,s=>`<div class="item"><b>${esc(s.name)}</b><div>Qtd: ${s.qty} · Custo: ${money(s.cost)} · Venda: ${money(s.price)}</div>${Number(s.qty)<=Number(s.min)?'<span class="bad">Estoque baixo</span>':''}<div class="actions"><button class="btn secondary" onclick="stockMove(${s.id},1)">+ Entrada</button><button class="btn secondary" onclick="stockMove(${s.id},-1)">- Saída</button><button class="btn danger" onclick="del('stock',${s.id})">Excluir</button></div></div>`))}
if(page==='Caixa'){let entries=db.cash.slice().reverse();out=section('Lançamento manual',`<form id="cashForm">${sel('Tipo','type',['entrada','saida'])}${sel('Categoria','category',['Serviço','Venda de celular','Produto / acessório','Serviço para lojista','Despesa fixa','Despesa variável','Outros'])}${field('Descrição','description','text','',true)}<div class="row">${field('Valor (R$)','amount','number','0',true)}${field('Data','date','date',today())}</div><button class="btn">Salvar lançamento</button></form>`)+section('Movimentações',list(entries,x=>`<div class="item"><b class="${x.type==='entrada'?'good':'bad'}">${x.type==='entrada'?'+':'−'} ${money(x.amount)}</b><div>${esc(x.description)} · ${esc(x.category)} · ${esc(x.date)}</div><button class="btn danger" onclick="del('cash',${x.id},true)">Excluir lançamento</button></div>`))}
if(page==='Lojistas'){out=section('Serviço para lojista',`<form id="retailForm">${field('Nome da loja / lojista','name','text','',true)}${field('Serviço realizado','service','text','',true)}<div class="row">${field('Valor (R$)','amount','number','0')}${field('Data','date','date',today())}</div>${area('Observações','notes')}<button class="btn">Registrar serviço</button></form>`)+section('Histórico',list(db.retail,x=>`<div class="item"><b>${esc(x.name)}</b><div>${esc(x.service)} · ${esc(x.date)} · ${money(x.amount)}</div><button class="btn danger" onclick="del('retail',${x.id})">Excluir</button></div>`))}
if(page==='Relatórios'){let ins=db.cash.filter(x=>x.type==='entrada').reduce((a,x)=>a+x.amount,0),outs=db.cash.filter(x=>x.type==='saida').reduce((a,x)=>a+x.amount,0);out=section('Resumo financeiro',`<div class="grid"><div class="stat">Entradas<b>${money(ins)}</b></div><div class="stat">Saídas<b>${money(outs)}</b></div><div class="stat">Saldo<b>${money(ins-outs)}</b></div><div class="stat">Clientes<b>${db.clients.length}</b></div></div><button class="btn" onclick="window.print()">Imprimir / salvar PDF</button><p class="muted">Use a opção “Salvar como PDF” na janela de impressão do navegador.</p>`)+section('Observação',`<div class="notice">O relatório considera os lançamentos do caixa. Nesta versão inicial, as vendas e ordens de serviço são registradas em seus históricos, mas a integração financeira automática completa ainda precisa ser configurada.</div>`)}
if(page==='Backup'){out=section('Backup e restauração',`<p>Exporte uma cópia dos dados para guardar em local seguro.</p><button class="btn" onclick="backup()">Baixar backup JSON</button><label>Restaurar backup JSON</label><input type="file" id="restoreFile" accept="application/json"><button class="btn secondary" onclick="restore()">Restaurar arquivo</button><div class="notice">O backup é manual. Os dados ficam neste navegador e não são enviados automaticamente para a nuvem. Guarde o arquivo em local seguro e não o publique no GitHub.</div>`)}
$('#app').innerHTML=out;bindForms()}
function bindForms(){let f=$('#clientForm');if(f)f.onsubmit=e=>{e.preventDefault();db.clients.push({...formData(f),id:id()});save()};f=$('#orderForm');if(f)f.onsubmit=e=>{e.preventDefault();let d=formData(f);if(!d.clientId||!db.clients.some(c=>c.id===Number(d.clientId))){alert('Selecione um cliente cadastrado.');return}db.orders.push({...d,id:id(),clientId:Number(d.clientId),date:today(),status:d.status||'Em andamento'});save()};f=$('#saleForm');if(f)f.onsubmit=e=>{e.preventDefault();let d=formData(f);db.sales.push({...d,id:id(),date:today()});save()};f=$('#stockForm');if(f)f.onsubmit=e=>{e.preventDefault();db.stock.push({...formData(f),id:id()});save()};f=$('#cashForm');if(f)f.onsubmit=e=>{e.preventDefault();let d=formData(f);db.cash.push({...d,id:id(),amount:Number(d.amount)});save()};f=$('#retailForm');if(f)f.onsubmit=e=>{e.preventDefault();let d=formData(f);db.retail.push({...d,id:id()});addCash('Serviço para lojista',d.name+' — '+d.service,d.amount,'entrada');save()}}
function del(key,n,confirmAlways=false){if(confirmAlways&&!confirm('Tem certeza de que deseja excluir este lançamento?'))return;if(!confirmAlways&&!confirm('Confirma a exclusão deste registro?'))return;db[key]=db[key].filter(x=>x.id!==n);save()}function advance(n){let o=db.orders.find(x=>x.id===n);if(!o)return;let next={'Em andamento':'Pronto','Pronto':'Entregue','Entregue':'Garantia','Garantia':'Entregue'};if(o.status==='Entregue'&&next[o.status]==='Garantia'){o.status='Garantia'}else{o.status=next[o.status]||'Em andamento'}if(o.status==='Entregue'&&!o.posted){let freight=o.deliveryPayer==='Loja'?Number(o.delivery):0;addCash('Serviço','OS #'+o.id+' — '+o.model,Number(o.price),'entrada',o.id);if(freight)addCash('Entrega','Entrega OS #'+o.id,freight,'saida',o.id);o.posted=true}else if(o.status==='Garantia'&&o.posted){db.cash=db.cash.filter(x=>x.ref!==o.id);o.posted=false}save()}function receipt(n){let o=db.orders.find(x=>x.id===n),c=db.clients.find(x=>x.id===o.clientId);let w=window.open('','_blank');w.document.write(`<html><meta charset="utf-8"><title>Comprovante OS</title><body style="font:15px Arial;padding:28px"><h2>INFOTECH ASSISTÊNCIA</h2><p>CNPJ: 47.897.628/0001-03</p><h3>Comprovante — OS #${o.id}</h3><p>Cliente: ${esc(c?.name)} · Telefone: ${esc(c?.phone)}</p><p>Data: ${o.date} · Aparelho: ${esc(o.model)}</p><p>Defeito: ${esc(o.defect)}</p><p>Serviço: ${esc(o.work)}</p><p>Garantia comercial: ${esc(o.warranty)}</p><h3>Total: ${money(o.price)}</h3><p>Garantia cobre defeitos relacionados às peças e ao serviço executado, observada a legislação aplicável. Não abrange danos decorrentes de mau uso, quedas, líquidos ou intervenção de terceiros, quando comprovados. Os direitos legais do consumidor permanecem preservados.</p><br><p>Assinatura: __________________________________</p><script>window.print()<\/script></body></html>`);w.document.close()}function clientHistory(n){let c=db.clients.find(x=>x.id===n),os=db.orders.filter(x=>x.clientId===n);alert('Histórico de '+c.name+'\n'+(os.map(o=>'OS #'+o.id+' · '+o.model+' · '+o.status).join('\n')||'Sem ordens de serviço.'))}function stockMove(n,delta){let s=db.stock.find(x=>x.id===n),v=prompt(delta>0?'Quantidade de entrada:':'Quantidade de saída:','1');if(v===null)return;let q=Number(v);if(!Number.isFinite(q)||q<=0)return alert('Informe uma quantidade válida.');if(s.qty*1+delta*q<0)return alert('Estoque insuficiente.');s.qty=Number(s.qty)+delta*q;save()}function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup-infotech-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}function restore(){let f=$('#restoreFile').files[0];if(!f)return alert('Selecione um arquivo JSON.');let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!confirm('A restauração substituirá os dados atuais. Continuar?'))return;db={...blank(),...d};save();alert('Backup restaurado.')}catch{alert('Arquivo inválido.')}};r.readAsText(f)}
render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
